name: build-macos

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # 1) Сборка CLI TgWsProxy под ARM64 (macOS 14)
  build-tgws-cli:
    runs-on: macos-14
    steps:
      - name: Resolve upstream tag
        id: ups
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=""
          for i in 1 2 3 4 5; do
            echo "attempt $i: querying Flowseal/tg-ws-proxy latest release"
            TAG=$(gh api repos/Flowseal/tg-ws-proxy/releases/latest --jq '.tag_name' 2>/dev/null || true)
            [ -n "$TAG" ] && break
            echo "  empty/invalid response, retrying in 15s"; sleep 15
          done
          echo "tag=${TAG:-1.6.6}" >> "$GITHUB_OUTPUT"
          echo "resolved upstream tag: ${TAG:-1.6.6}"

      - name: Checkout upstream (with retry)
        uses: actions/checkout@v4
        with:
          repository: Flowseal/tg-ws-proxy
          ref: ${{ steps.ups.outputs.tag }}
          path: upstream
          continue-on-error: true

      - name: Ensure upstream cloned (retry on transient network failure)
        shell: bash
        run: |
          if [ ! -f upstream/pyproject.toml ]; then
            rm -rf upstream
            for i in 1 2 3 4 5; do
              echo "clone attempt $i"
              git clone --depth 1 --branch "${{ steps.ups.outputs.tag }}" \
                https://github.com/Flowseal/tg-ws-proxy.git upstream && break
              sleep 10
            done
          fi
          test -f upstream/pyproject.toml || { echo 'upstream clone failed'; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (headless)
        shell: bash
        working-directory: upstream
        run: |
          pip install --upgrade pip pyinstaller certifi
          python - <<'PY'
          import tomllib, re
          deps = []
          try:
            with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
            deps = [x for x in d.get('project', {}).get('dependencies', [])
                    if not re.match(r'^(pystray|customtkinter|pillow|pyperclip|pyobjc|pyobjc-framework)', x, re.I)]
          except FileNotFoundError:
            try:
              deps = [l for l in open('requirements.txt') if l.strip() and not l.startswith('#')
                      and not re.match(r'^(pystray|customtkinter|pillow|pyperclip|pyobjc|pyobjc-framework)', l, re.I)]
            except FileNotFoundError:
              deps = []
          open('req-cli.txt', 'w').write('\n'.join(deps))
          PY
          pip install -r req-cli.txt

      - name: Build thin CLI (arm64)
        shell: bash
        working-directory: upstream
        run: |
          cat > _cli.py <<'PY'
          from proxy.tg_ws_proxy import main
          if __name__ == '__main__':
              main()
          PY
          pyinstaller --onefile --console --name TgWsProxy \
            --target-arch arm64 \
            --collect-all certifi \
            --hidden-import proxy --hidden-import proxy.tg_ws_proxy --hidden-import proxy.bridge \
            --hidden-import proxy.config --hidden-import proxy.balancer --hidden-import proxy.fake_tls \
            --hidden-import proxy.raw_websocket --hidden-import proxy.stats --hidden-import proxy.utils \
            --hidden-import utils.logging_setup \
            --exclude-module pystray --exclude-module customtkinter --exclude-module PIL \
            --exclude-module tkinter --exclude-module macos --exclude-module windows --exclude-module linux \
            _cli.py
          test -f dist/TgWsProxy || { echo 'Build failed'; exit 1; }
          file dist/TgWsProxy

      - uses: actions/upload-artifact@v4
        with:
          name: tgws-cli-macos-arm64
          path: upstream/dist/TgWsProxy
          if-no-files-found: error

  # 2) Сборка Slipgate для macOS ARM64
  build-mac:
    needs: build-tgws-cli
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch macOS tgws CLI (arm64)
        uses: actions/download-artifact@v4
        with:
          name: tgws-cli-macos-arm64
          path: resources/macos/tgws

      - name: Fix exec bit + place binary
        run: |
          chmod +x resources/macos/tgws/TgWsProxy
          test -x resources/macos/tgws/TgWsProxy
          file resources/macos/tgws/TgWsProxy

      - name: Fetch ZapretMac payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          URL=""
          for i in 1 2 3 4 5; do
            echo "attempt $i: querying Flowseal/zapret-mac-discord-youtube latest release"
            URL=$(gh api repos/Flowseal/zapret-mac-discord-youtube/releases/latest \
              --jq '.assets[] | select(.name | endswith("ZapretMac-macOS-universal.zip")) | .browser_download_url' \
              2>/dev/null || true)
            if [ -n "$URL" ]; then break; fi
            echo "  empty/invalid URL (rate-limit or transient), retrying in 15s"; sleep 15
          done
          if [ -z "$URL" ]; then
            echo "::error::Failed to resolve ZapretMac-macOS-universal.zip download URL after retries (GitHub API rate limit?)."
            exit 1
          fi
          echo "resolved URL: $URL"
          curl -sSL -o /tmp/zapret-mac.zip "$URL"
          mkdir -p /tmp/zapret-mac && cd /tmp/zapret-mac && unzip -o /tmp/zapret-mac.zip

          # Находим каталог с файлами Zapret
          SRC=$(find /tmp/zapret-mac -name install.sh -exec dirname {} \; | head -1)
          test -n "$SRC"

          # Переходим обратно в корень репозитория и гарантированно создаем папку назначения
          cd "$GITHUB_WORKSPACE"
          mkdir -p resources/macos/zapret

          # Копируем содержимое (с флагом -a, чтобы корректно сохранить все права и вложенные каталоги)
          cp -a "$SRC/." resources/macos/zapret/

          chmod +x resources/macos/zapret/*.sh resources/macos/zapret/bin/utunws || true
          # Жёсткие проверки: если payload не плоский или неполный — падаем,
          # а не собираем .dmg с бинарём, который в приложении даст
          # «Скопированный payload не содержит install.sh».
          test -f resources/macos/zapret/bin/utunws
          test -f resources/macos/zapret/install.sh
          test -f resources/macos/zapret/run.sh
          test -f resources/macos/zapret/strategies.tsv || find resources/macos/zapret -name strategies.tsv

      - name: Apply Slipgate-patched run.sh
        run: |
          # The upstream payload fetched above copies its own run.sh over ours.
          # Restore our hardened version (early engine.log logging + bounded
          # network-detection retry) which ships in the repo and is what the app
          # actually installs — it both fixes and diagnoses the silent pre-flight
          # failure that left engine.log MISSING.
          git checkout -- resources/macos/zapret/run.sh
          chmod +x resources/macos/zapret/run.sh
          test -f resources/macos/zapret/run.sh
          if grep -q 'preflight' resources/macos/zapret/run.sh; then
            echo "patched run.sh in place"
          else
            echo "::error::patched run.sh was not restored (grep 'preflight' not found)"
            exit 1
          fi

      - name: Install deps
        run: pnpm install --frozen-lockfile=false

      - name: Build + package
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --publish never --mac --arm64

      - uses: actions/upload-artifact@v4
        with:
          name: slipgate-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.pkg
          if-no-files-found: error
