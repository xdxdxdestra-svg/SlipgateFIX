appId: com.slipgate.app
productName: Slipgate
electronLanguages:
  - en-US
  - ru
directories:
  buildResources: build
files:
  - '!/.vscode/*'
  - '!src/*'
  - '!aur/*'
  - '!images/*'
  - '!scripts/*'
  - '!extra/*'
  - '!tailwind.config.js'
  - '!postcss.config.js'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Общие ресурсы (иконки и т.п.) — попадают в обе платформы. Кладутся плоско
# в resources/ корня приложения (to: ''), как было раньше.
extraResources:
  - from: './resources/common/'
    to: ''
    filter:
      - '**/*'
protocols:
  name: 'Slipgate URI Scheme'
  schemes:
    - 'slipgate'
    - 'tg-ws'
win:
  target:
    - nsis
    - 7z
  artifactName: ${productName}_${arch}-portable.${ext}
  requestedExecutionLevel: requireAdministrator
  # Только Windows-ресурсы: winws.exe, WinDivert, .bat стратегии, TgWsProxy_windows.exe
  extraResources:
    - from: './resources/common/'
      to: ''
      filter:
        - '**/*'
    - from: './resources/windows/'
      to: ''
      filter:
        - '**/*'
nsis:
  artifactName: ${productName}_${arch}.${ext}
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
  include: build/nsis/installer.nsh
mac:
  target:
    - dmg
    - zip
    # - pkg    # опционально; требует подписи/notarize — по умолчанию выключен
  # hardenedRuntime требует валидную подпись; без сертификата CI собирает с
  # ad-hoc подписью (CSC_IDENTITY_AUTO_DISCOVERY=false). Оставляем hardenedRuntime: true
  # и entitlements без sandbox (для работы сетевого backend).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}_${arch}.${ext}
  # Только macOS-ресурсы: utunws/payload ZapretMac + TgWsProxy (universal2 CLI)
  extraResources:
    - from: './resources/common/'
      to: ''
      filter:
        - '**/*'
    - from: './resources/macos/'
      to: ''
      filter:
        - '**/*'
linux:
  desktop:
    entry:
      Name: Slipgate
      MimeType: 'x-scheme-handler/slipgate;x-scheme-handler/tg-ws'
  target:
    - deb
    - rpm
    - pacman
npmRebuild: true
publish: []
